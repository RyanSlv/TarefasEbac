<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Clientes</title>
</h:head>

<h:body>

    <h:form id="formCliente">

        <p:growl id="growl" showDetail="true" />

        <p:panel header="Cadastro de Cliente">

            <p:panelGrid columns="2">

                <p:outputLabel value="Nome:" />
                <p:inputText value="#{clienteController.cliente.nome}" />

                <p:outputLabel value="CPF:" />
                <p:inputText value="#{clienteController.cliente.cpf}" />

                <p:outputLabel value="Telefone:" />
                <p:inputText value="#{clienteController.cliente.tel}" />

                <p:outputLabel value="Endereço:" />
                <p:inputText value="#{clienteController.cliente.endereco}" />

                <p:outputLabel value="Número:" />
                <p:inputText value="#{clienteController.cliente.numero}" />

                <p:outputLabel value="Cidade:" />
                <p:inputText value="#{clienteController.cliente.cidade}" />

                <p:outputLabel value="Estado:" />
                <p:inputText value="#{clienteController.cliente.estado}" />

            </p:panelGrid>

            <p:commandButton
                value="Cadastrar"
                action="#{clienteController.add}"
                process="@form"
                update="@form"
                rendered="#{not clienteController.isUpdate}" />

            <p:commandButton
                value="Atualizar"
                action="#{clienteController.update}"
                process="@form"
                update="@form"
                rendered="#{clienteController.isUpdate}" />

            <p:commandButton
                value="Cancelar"
                action="#{clienteController.cancel}"
                process="@this"
                update="@form"
                immediate="true"
                rendered="#{clienteController.isUpdate}" />

        </p:panel>

        <br />

        <p:dataTable
            value="#{clienteController.clientes}"
            var="cliente">

            <p:column headerText="Nome">
                <h:outputText value="#{cliente.nome}" />
            </p:column>

            <p:column headerText="CPF">
                <h:outputText value="#{cliente.cpf}" />
            </p:column>

            <p:column headerText="Telefone">
                <h:outputText value="#{cliente.tel}" />
            </p:column>

            <p:column headerText="Cidade">
                <h:outputText value="#{cliente.cidade}" />
            </p:column>

            <p:column headerText="Estado">
                <h:outputText value="#{cliente.estado}" />
            </p:column>

            <p:column headerText="Ações">

                <p:commandButton
                    value="Editar"
                    action="#{clienteController.edit(cliente)}"
                    process="@this"
                    update="@form" />

                <p:commandButton
                    value="Excluir"
                    action="#{clienteController.delete(cliente)}"
                    process="@this"
                    update="@form" />

            </p:column>

        </p:dataTable>

    </h:form>

</h:body>

</html>
